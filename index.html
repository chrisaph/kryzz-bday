<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Messages to Kryzz</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      
      <!-- VIEW 1: HOMEPAGE[cite: 1, 4] -->
      <div id="home-view" class="view">
        <h1>Birthday Messages to Kryzz</h1>
        <h2>Who are you?</h2>
        <input type="text" id="name-input" placeholder="Name pls" />
        
        <p class="notice">You can only enter your name and message once</p>
        
        <textarea id="message-input" placeholder="Enter your lovely greetings here"></textarea>
        
        <select id="design-select">
          <option value="style1">Pink Sparkle</option>
          <option value="style2">Green Mint</option>
        </select>
        
        <button id="submit-btn">Greet Kryzz!</button>
      </div>

      <!-- VIEW 2: GAME PAGE[cite: 2, 4] -->
      <div id="game-view" class="view hidden">
        <h1>Birthday Messages to Kryzz</h1>
        <h2 class="animated-title">Find the same favorite thing Kryzz likes!</h2>
        <p>Click the messages!</p>
        <p>Time: <span id="timer-display">0</span>s</p>
        
        <div id="game-board" class="grid-container">
          <!-- Cards will be generated here by TypeScript -->
        </div>
      </div>

      <!-- VIEW 3: WIN SCREEN[cite: 3, 4] -->
      <div id="win-view" class="view hidden">
        <h1>Birthday Messages to Kryzz</h1>
        <h2 class="win-animation">You Won!</h2>
        <p id="final-time-display">Your Time is 0:00 minutes</p>
        
        <h3>Leaderboard</h3>
        <ol id="leaderboard-list">
          <!-- Leaderboard times will appear here -->
        </ol>
        
        <button id="play-again-btn">Play again?</button>
      </div>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
